name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: "8.0"
          mongodb-replica-set: rs0

      - name: Diagnose MongoDB startup failure
        if: failure()
        run: |
          docker ps -a --no-trunc
          docker logs mongodb || true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Check documentation
        run: npm run docs:check

      - name: Run backend tests
        run: npm run test:coverage
        env:
          RUN_NATIVE_API_TESTS: "1"
          RUN_GOODS_RECEIPT_TESTS: "1"

      - name: Install diff-cover
        if: ${{ github.event_name == 'pull_request' }}
        run: python -m pip install --disable-pip-version-check diff-cover==10.6.0

      - name: Enforce changed-line coverage
        if: ${{ github.event_name == 'pull_request' }}
        run: diff-cover coverage/lcov.info --compare-branch=origin/main --fail-under=80 --include 'src/**'
